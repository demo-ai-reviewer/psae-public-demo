name: PSAE pre-review

# Reviews every pull request when it is opened and on every push (force
# pushes included). The review lives in demo-ai-reviewer/psae-pre-review-test.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pre-review:
    if: ${{ !github.event.pull_request.draft }}
    concurrency:
      group: psae-pre-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: demo-ai-reviewer/psae-pre-review-test/.github/workflows/pre-review.yml@main
    secrets: inherit
